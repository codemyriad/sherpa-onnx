name: windows-x64

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
    paths:
      - '.github/workflows/windows-x64.yaml'
      - '.github/scripts/test-offline-whisper.sh'
      - '.github/scripts/test-offline-cohere-transcribe.sh'
      - '.github/scripts/test-offline-moonshine.sh'
      - '.github/scripts/test-cxx-api.sh'
      - '.github/scripts/test-speaker-diarization.sh'
      - '.github/scripts/test-online-punctuation.sh'
      - '.github/scripts/test-offline-punctuation.sh'
      - '.github/scripts/test-c-api.sh'
      - '.github/scripts/test-audio-tagging.sh'
      - '.github/scripts/test-spoken-language-identification.sh'
      - '.github/scripts/test-online-ctc.sh'
      - '.github/scripts/test-offline-tts.sh'
      - '.github/scripts/test-online-paraformer.sh'
      - '.github/scripts/test-offline-ctc.sh'
      - '.github/scripts/test-offline-transducer.sh'
      - '.github/scripts/test-online-transducer.sh'
      - '.github/scripts/common.sh'
      - 'cmake/**'
      - 'sherpa-onnx/csrc/*'

  workflow_dispatch:
    inputs:
      tests:
        description: Model test coverage (all 32 build configurations are always built)
        type: choice
        default: smoke
        options:
          - smoke
          - full
      max_parallel:
        description: Concurrent jobs (auto uses repository policy)
        type: choice
        default: auto
        options:
          - auto
          - '4'
          - '8'
          - '16'
          - '32'

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_x64:
    name: shared-${{ matrix.shared_lib }} tts-${{ matrix.with_tts }} static CRT ${{ matrix.use_static_crt }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Preserve upstream throughput; forks default to leaving org runners free.
      # A dispatch input overrides the repository variable, then this default.
      max-parallel: ${{ fromJSON((inputs.max_parallel != 'auto' && inputs.max_parallel) || vars.WINDOWS_X64_MAX_PARALLEL || ((github.repository_owner == 'k2-fsa' || github.repository_owner == 'csukuangfj') && '32' || '4')) }}
      matrix:
        os: [windows-2022]
        build_type: [Release, Debug, MinSizeRel, RelWithDebInfo]
        shared_lib: [ON, OFF]
        with_tts: [ON, OFF]
        use_static_crt: [ON, OFF]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: find dumpbin
        shell: bash
        run: |
          which dumpbin

      - name: Configure CMake
        shell: bash
        run: |
          mkdir build

          cmake --version

          cd build
          cmake \
            -A x64 \
            -DSHERPA_ONNX_ENABLE_TTS=${{ matrix.with_tts }} \
            -DSHERPA_ONNX_USE_STATIC_CRT=${{ matrix.use_static_crt }} \
            -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -D SHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -D BUILD_SHARED_LIBS=${{ matrix.shared_lib }} \
            -D CMAKE_INSTALL_PREFIX=./install \
            -D BUILD_ESPEAK_NG_EXE=OFF \
            ..

      - name: Check 1
        shell: bash
        run: |
          cd build

          cat sherpa-onnx/csrc/sherpa-onnx.vcxproj

      - name: Check 2
        shell: cmd
        run: |
          cd build

          findstr /R /C:"<RuntimeLibrary>" sherpa-onnx\csrc\sherpa-onnx.vcxproj

      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-vcxproj-windows-x64-${{ matrix.shared_lib }}-${{ matrix.with_tts }}-static-crt-${{ matrix.use_static_crt }}-${{ matrix.build_type }}
          path: build/sherpa-onnx/csrc/sherpa-onnx.vcxproj

      - name: Check 3
        shell: bash
        run: |
          cd build

          cat c-api-examples/vad-whisper-c-api.vcxproj

      - name: Check 4
        shell: cmd
        run: |
          cd build

          findstr /R /C:"<RuntimeLibrary>" "c-api-examples\vad-whisper-c-api.vcxproj"

      - uses: actions/upload-artifact@v4
        with:
          name: vad-whisper-c-api-vcxproj-windows-x64-${{ matrix.shared_lib }}-${{ matrix.with_tts }}-static-crt-${{ matrix.use_static_crt }}-${{ matrix.build_type }}
          path: build/c-api-examples/vad-whisper-c-api.vcxproj

      - name: Build sherpa-onnx for windows
        shell: bash
        run: |
          cd build

          cmake --version

          cmake --build . --config ${{ matrix.build_type }} -- -m:2
          cmake --install . --config ${{ matrix.build_type }}

          ls -lh ./bin/${{ matrix.build_type }}/sherpa-onnx.exe

      - name: Show exe
        shell: bash
        run: |
          ls -lh "$PWD/build/bin/${{ matrix.build_type }}"

      - name: Dump CRT dependencies
        shell: cmd
        run: |
          dumpbin /dependents build\bin\${{ matrix.build_type }}\sherpa-onnx.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ matrix.shared_lib }}-${{ matrix.with_tts }}-static-crt-${{ matrix.use_static_crt }}-${{ matrix.build_type }}
          path: build/install/*

      - name: Smoke test C/C++ API versions
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          export PATH=$PWD/build/bin/${{ matrix.build_type }}:$PATH
          build/bin/${{ matrix.build_type }}/version-c-api.exe
          build/bin/${{ matrix.build_type }}/version-cxx-api.exe

      # API examples are not installed by CMake; retain the build's runnable
      # binaries separately from the install artifact used by downstream jobs.
      - name: Upload representative test runtime
        if: >-
          !startsWith(github.ref, 'refs/tags/') &&
          (github.event_name == 'push' || inputs.tests == 'full') &&
          matrix.build_type == 'Release' && matrix.with_tts == 'ON' &&
          matrix.use_static_crt == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-test-runtime-${{ matrix.shared_lib }}
          path: |
            build/bin/Release/*
            !build/bin/Release/*.pdb
          if-no-files-found: error
          retention-days: 1

      - name: Retain symbols and remove build intermediates
        shell: bash
        run: |
          df -h .
          du -sh build build/install
          if [[ "${{ matrix.build_type }}" == "Debug" || "${{ matrix.build_type }}" == "RelWithDebInfo" ]]; then
            echo "Copy matching PDB files..."

            build_bin_dir=build/bin/${{ matrix.build_type }}
            install_bin_dir=build/install/bin

            for exe in "${install_bin_dir}"/*.exe; do
              base=$(basename "$exe" .exe)
              pdb=${build_bin_dir}/${base}.pdb

              if [[ -f "$pdb" ]]; then
                echo "Copying $pdb"
                cp "$pdb" "${install_bin_dir}/"
              else
                echo "No PDB found for $base"
              fi
            done
          fi

          # Preserve only the installed package before downloading smoke models.
          find build -mindepth 1 -maxdepth 1 ! -name install -exec rm -rf {} +
          df -h .

      - name: Cache smoke-test Whisper model
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@v4
        with:
          path: .ci-models/whisper
          key: windows-x64-whisper-tiny.en-v1

      - name: Smoke test installed recognizer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          WHISPER_MODEL_CACHE_DIR: ${{ github.workspace }}/.ci-models/whisper
        run: |
          export PATH=$PWD/build/install/bin:$PWD/build/install/lib:$PATH
          export EXE=$PWD/build/install/bin/sherpa-onnx-offline.exe
          .github/scripts/test-offline-whisper.sh tiny.en

      - name: Package files
        shell: bash
        run: |
          SHERPA_ONNX_VERSION=v$(grep "SHERPA_ONNX_VERSION" ./CMakeLists.txt  | cut -d " " -f 2  | cut -d '"' -f 2)

          shared_lib=${{ matrix.shared_lib }}
          use_static_crt=${{ matrix.use_static_crt }}
          if [[ $shared_lib == "ON" ]]; then
            if [[ $use_static_crt == ON ]]; then
              suffix=shared-MT-${{ matrix.build_type }}
            else
              suffix=shared-MD-${{ matrix.build_type }}
            fi
          else
            if [[ $use_static_crt == ON ]]; then
              suffix=static-MT-${{ matrix.build_type }}
            else
              suffix=static-MD-${{ matrix.build_type }}
            fi
          fi

          if [[ ${{ matrix.with_tts }} == ON ]]; then
            dst=sherpa-onnx-${SHERPA_ONNX_VERSION}-win-x64-$suffix
          else
            dst=sherpa-onnx-${SHERPA_ONNX_VERSION}-win-x64-$suffix-no-tts
          fi

          # Move the install tree on the same drive instead of copying large
          # static libraries. PDBs and test runtimes have been retained above.
          df -h .
          du -sh build build/install
          mkdir "$dst"
          mv build/install/bin build/install/lib build/install/include "$dst/"
          rm -rf build
          df -h .

          rm -rf "$dst/lib/pkgconfig"
          rm -f "$dst/lib/cargs.dll" "$dst/lib/cargs.lib" "$dst/lib/cargs.h"
          rm -f "$dst/include/cargs.h"

          ls -lh "$dst/bin/"
          echo "---"
          ls -lh "$dst/lib/"

          tar cjvf "${dst}.tar.bz2" "$dst"

          lib_dst=${dst}-lib
          mkdir -p "$lib_dst"
          # The complete archive already contains lib/. Reuse that directory
          # for the library-only archive without another copy of the libraries.
          mv "$dst/lib" "$lib_dst/lib"
          find "$lib_dst/lib" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          rm -f "$lib_dst/lib/cargs.h"
          if [[ $shared_lib == "ON" ]]; then
            find "$lib_dst/lib" -maxdepth 1 -type f ! -name '*.dll' ! -name '*.lib' -delete
          else
            find "$lib_dst/lib" -maxdepth 1 -type f ! -name '*.lib' -delete
          fi
          ls -lh "$lib_dst/lib/"
          tar cjvf "${lib_dst}.tar.bz2" "$lib_dst"
          rm -rf "$dst" "$lib_dst"
          df -h .

          ls -lh ./*.tar.bz2

      # https://huggingface.co/docs/hub/spaces-github-actions
      - name: Publish to huggingface
        if: (github.repository_owner == 'csukuangfj' || github.repository_owner == 'k2-fsa') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        uses: nick-fields/retry@v3
        with:
          max_attempts: 20
          timeout_seconds: 200
          shell: bash
          command: |
            SHERPA_ONNX_VERSION=$(grep "SHERPA_ONNX_VERSION" ./CMakeLists.txt  | cut -d " " -f 2  | cut -d '"' -f 2)
            git config --global user.email "csukuangfj@gmail.com"
            git config --global user.name "Fangjun Kuang"

            rm -rf huggingface
            export GIT_CLONE_PROTECTION_ACTIVE=false
            GIT_LFS_SKIP_SMUDGE=1 git clone https://huggingface.co/csukuangfj2/sherpa-onnx-libs huggingface

            cd huggingface
            dst=win64/$SHERPA_ONNX_VERSION
            mkdir -p $dst

            cp -v ../sherpa-onnx-*.tar.bz2 $dst

            git status
            git lfs track "*.bz2"

            git add .

            git commit -m "upload sherpa-onnx-${SHERPA_ONNX_VERSION}"

            git push https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/sherpa-onnx-libs main

      - name: Release pre-compiled binaries and libs for Windows x64
        if: github.repository_owner == 'csukuangfj' && github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: sherpa-onnx-*-win-x64*.tar.bz2
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: v1.12.31

      - name: Release pre-compiled binaries and libs for Windows x64
        if: github.repository_owner == 'k2-fsa'&& github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: sherpa-onnx-*-win-x64*.tar.bz2

  model_tests:
    name: Model tests shared-${{ matrix.shared_lib }} (${{ matrix.suite }})
    needs: windows_x64
    # Still test available representative runtimes if an unrelated build fails.
    if: >-
      !cancelled() && !startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' || inputs.tests == 'full')
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Preserve upstream throughput; forks default to leaving org runners free.
      # A dispatch input overrides the repository variable, then this default.
      max-parallel: ${{ fromJSON((inputs.max_parallel != 'auto' && inputs.max_parallel) || vars.WINDOWS_X64_MAX_PARALLEL || ((github.repository_owner == 'k2-fsa' || github.repository_owner == 'csukuangfj') && '32' || '4')) }}
      matrix:
        shared_lib: [ON, OFF]
        suite: [api, offline-asr, online-asr, speech]
    steps:
      - uses: actions/checkout@v4

      - name: Download Release TTS static-CRT runtime
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-test-runtime-${{ matrix.shared_lib }}
          path: test-runtime

      - name: Test offline Cohere Transcribe for windows x64
        if: matrix.suite == 'offline-asr'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=sherpa-onnx-offline.exe

          .github/scripts/test-offline-cohere-transcribe.sh

      - name: Test offline Moonshine for windows x64
        if: matrix.suite == 'offline-asr'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=sherpa-onnx-offline.exe

          .github/scripts/test-offline-moonshine.sh

      - name: Test C++ API
        if: matrix.suite == 'api'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export CXX_STREAMING_ZIPFORMER_EXE=streaming-zipformer-cxx-api.exe
          export CXX_WHISPER_EXE=whisper-cxx-api.exe
          export CXX_SENSE_VOICE_EXE=sense-voice-cxx-api.exe

          .github/scripts/test-cxx-api.sh

      - name: Test offline speaker diarization
        if: matrix.suite == 'speech'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=sherpa-onnx-offline-speaker-diarization.exe

          .github/scripts/test-speaker-diarization.sh

      - name: Test online punctuation
        if: matrix.suite == 'speech'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=sherpa-onnx-online-punctuation.exe

          .github/scripts/test-online-punctuation.sh

      - name: Test offline punctuation
        if: matrix.suite == 'speech'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=sherpa-onnx-offline-punctuation.exe

          .github/scripts/test-offline-punctuation.sh

      - name: Test C API
        if: matrix.suite == 'api'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export SLID_EXE=spoken-language-identification-c-api.exe
          export SID_EXE=speaker-identification-c-api.exe
          export AT_EXE=audio-tagging-c-api.exe
          export PUNCT_EXE=add-punctuation-c-api.exe
          export VERSION_EXE=version-c-api.exe

          .github/scripts/test-c-api.sh

      - name: Test Audio tagging
        if: matrix.suite == 'api'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=sherpa-onnx-offline-audio-tagging.exe

          .github/scripts/test-audio-tagging.sh

      - name: Test spoken language identification (C++ API)
        if: matrix.suite == 'api'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=sherpa-onnx-offline-language-identification.exe

          .github/scripts/test-spoken-language-identification.sh

      - name: Test online CTC
        if: matrix.suite == 'online-asr'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=sherpa-onnx.exe

          .github/scripts/test-online-ctc.sh

      - name: Test offline TTS
        if: matrix.suite == 'speech'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=sherpa-onnx-offline-tts.exe

          .github/scripts/test-offline-tts.sh

      - name: Test online paraformer for windows x64
        if: matrix.suite == 'online-asr'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=sherpa-onnx.exe

          .github/scripts/test-online-paraformer.sh

      - name: Test offline Whisper for windows x64
        if: matrix.suite == 'offline-asr'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=sherpa-onnx-offline.exe

          .github/scripts/test-offline-whisper.sh tiny.en tiny

      - name: Test offline CTC for windows x64
        if: matrix.suite == 'offline-asr'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=sherpa-onnx-offline.exe

          .github/scripts/test-offline-ctc.sh

      - name: Test offline transducer for Windows x64
        if: matrix.suite == 'offline-asr'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=sherpa-onnx-offline.exe

          .github/scripts/test-offline-transducer.sh

      - name: Test online transducer for Windows x64
        if: matrix.suite == 'online-asr'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=sherpa-onnx.exe

          .github/scripts/test-online-transducer.sh

      - name: Test online transducer (C API)
        if: matrix.suite == 'online-asr'
        shell: bash
        run: |
          export PATH=$PWD/test-runtime:$PATH
          export EXE=decode-file-c-api.exe

          .github/scripts/test-online-transducer.sh
